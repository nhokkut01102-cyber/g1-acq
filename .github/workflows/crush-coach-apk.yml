name: Crush Coach APK

on:
  push:
    paths:
      - "crush-coach/**"
      - ".github/workflows/crush-coach-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crush-coach
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crush-coach-apk
          path: crush-coach/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: crush-coach/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
